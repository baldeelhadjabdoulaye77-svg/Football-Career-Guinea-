<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Career Guinea - Ultimate Cinematic Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#060911;color:#f0f6fc;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-image:radial-gradient(circle at 50% 0%, #1e1b4b 0%, #060911 85%)}
.wrap{max-width:1050px;margin:auto;padding:15px}
h1{font-size:24px;margin:0;color:#38bdf8;text-transform:uppercase;letter-spacing:1px;text-shadow:0 0 12px rgba(56,189,248,0.4)}
.muted{color:#94a3b8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
button,select,input{font:inherit}
button{background:linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);color:#0f172a;border:none;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;transition:transform 0.15s, box-shadow 0.2s;text-transform:uppercase;letter-spacing:0.5px}
button:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(56,189,248,0.5)}
button:active{transform:translateY(0)}
input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;margin-bottom:10px}
.card{background:#1e293b;border:1px solid #334155;padding:18px;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,0.4);margin-bottom:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg, #38bdf8, #a855f7, #f43f5e)}
.stat{font-size:24px;font-weight:900;color:#38bdf8}
.badge{display:inline-block;background:rgba(56,189,248,0.15);color:#38bdf8;border:1px solid #38bdf8;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin-right:5px;margin-bottom:5px}
.choice{display:block;width:100%;text-align:left;margin-top:10px;background:#0f172a;color:#fff;border:1px solid #334155}
.choice:hover{background:#334155;border-color:#38bdf8}

/* MODULE CINÉMATIQUE SUPRÊME */
.cinematic{background:linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);border:2px solid #a855f7;text-align:center;padding:25px;border-radius:18px;box-shadow:0 0 35px rgba(168,85,247,0.35);margin-bottom:15px;position:relative;overflow:hidden}
.cinematic::after{content:'';position:absolute;bottom:0;right:0;width:100px;height:100px;background:radial-gradient(circle, rgba(56,189,248,0.2) 0%, transparent 70%);pointer-events:none}
.cinematic h2{color:#f43f5e;font-size:24px;margin-top:0;text-transform:uppercase;letter-spacing:1px}
.cinematic h4{color:#38bdf8;margin-bottom:8px}
.hero{background:linear-gradient(135deg, #1e293b 0%, #0f172a 100%);border-radius:14px;padding:20px;border:1px solid #475569}
.journalism{background:#0b0f19;border-left:4px solid #f43f5e;padding:14px;margin:12px 0;font-style:italic;border-radius:0 8px 8px 0;text-align:left}
.reporter-tag{display:inline-block;background:#f43f5e;color:#fff;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:bold;text-transform:uppercase;margin-bottom:5px;font-style:normal}
</style>
</head>
<body>
<div class="wrap">
  <div class="card hero">
    <h1>⚽ FOOTBALL CAREER - CINEMATIC & PRO EDITION</h1>
    <div id="subtitle" class="muted">Chargement du moteur de carrière...</div>
  </div>
  <div id="tabs" class="card" style="display:none;padding:8px">
    <button onclick="page('Accueil')">🏠 Accueil</button>
    <button onclick="page('Nationale')">🇬🇳 Équipe Nationale</button>
    <button onclick="page('Carrière')">📈 Carrière</button>
    <button onclick="page('Agent')">🤝 Agent</button>
    <button onclick="page('Vie')">🏠 Vie & Légal</button>
    <button onclick="page('Voyages')">✈️ Voyages / Hôtels</button>
    <button onclick="page('Sauvegarde')">💾 Option</button>
  </div>
  <div id="app"></div>
</div>

<script>
const WORLD_DESTINATIONS = [
  { name: "Guinée (Conakry / Labé)", cost: 500, visa: false, desc: "Stage national, académies locales et audiences diplomatiques." },
  { name: "Sénégal (Dakar)", cost: 1200, visa: false, desc: "Tournois U15/U17 Ouest-Africains & Hôtels 5 étoiles du littoral." },
  { name: "Côte d'Ivoire (Abidjan)", cost: 1500, visa: false, desc: "Centres de formation internationaux et compétitions de jeunes." },
  { name: "Maroc (Rabat / Marrakech)", cost: 2500, visa: true, desc: "Complexes sportifs VIP, séjours hôteliers de luxe." },
  { name: "France (Paris / Lyon)", cost: 4000, visa: true, desc: "Essais de 2 semaines en clubs pros européens & Hôtels haut de gamme." },
  { name: "Émirats Arabes Unis (Dubaï)", cost: 6000, visa: true, desc: "Stages de préparation VIP, yachts et événements médiatiques." },
  { name: "États-Unis (Miami / New York)", cost: 8000, visa: true, desc: "Tournées internationales, villas d'exception et matchs NBA." }
];

let S = load();

function load(){try{return JSON.parse(localStorage.getItem("FCGUINEA_SAVE"))}catch(e){return null}}
function persist(){localStorage.setItem("FCGUINEA_SAVE",JSON.stringify(S))}
function clamp(x,a=0,b=100){return Math.max(a,Math.min(b,x))}

function overall(){
  return Math.round((S.tech + S.speed + S.finish + S.vision + S.phys) / 5);
}

function getNationTeam(){
  if(S.age < 14) return "Sélection Régionale Découverte";
  if(S.age === 14 || S.age === 15) return "Guinée U15 / U16";
  if(S.age === 16 || S.age === 17) return "Guinée U17 / U18";
  if(S.age >= 18 && S.age < 21) return "Guinée U20 / Espoirs";
  return "Syli National (Sénior A)";
}

function start(){
  document.getElementById("tabs").style.display="none";
  document.getElementById("app").innerHTML=`
    <div class="card cinematic">
      <h2>🎬 DÉBUTEZ VOTRE LÉGENDE</h2>
      <p>Incarnez un prodige dès ses 6 ans. Faites vos choix d'agent, participez aux conférences de presse, réalisez des essais de 2 semaines en Europe et devenez le plus jeune joueur pro !</p>
      <input id="nm" placeholder="Nom de famille" value="Baldé">
      <input id="fnm" placeholder="Prénom" value="Abdoulaye">
      <button onclick="newGame()">Lancer le Moteur Interactif</button>
    </div>`;
}

function newGame(){
  let nm = document.getElementById("nm").value || "Baldé";
  let fnm = document.getElementById("fnm").value || "Abdoulaye";
  S = {
    name: nm, fname: fnm, age: 6, year: 2026, chapter: 1, country: "Guinée", club: "Académie de Conakry",
    money: 1000, rep: 10, energy: 100, school: 85, family: 90, mental: 60,
    tech: 35, speed: 40, finish: 30, vision: 30, phys: 30,
    matches: 0, goals: 0, assists: 0, nationalCaps: 0, nationalGoals: 0,
    agent: "Parents", agentTrust: 100, agentFee: 0,
    sponsor: "Aucun", style: "Neutre",
    hasPrivateJet: false, trialClub: null,
    licenses: { auto: false, boat: false, pilot: false },
    visas: { "Maroc": false, "France": false, "Émirats Arabes Unis": false, "États-Unis": false },
    proDebut: false
  };
  persist();
  page("Accueil");
}

function page(p){
  if(!S){start();return;}
  document.getElementById("tabs").style.display="block";
  document.getElementById("subtitle").innerHTML = `<b>${S.fname} ${S.name}</b> | ${S.age} ans | ${S.club} | Note globale : <b>${overall()}</b> | Fortune : <b>${S.money} €</b>`;
  let app = document.getElementById("app");
  if(p==="Accueil") app.innerHTML = homePage();
  else if(p==="Nationale") app.innerHTML = nationalPage();
  else if(p==="Carrière") app.innerHTML = careerPage();
  else if(p==="Agent") app.innerHTML = agentPage();
  else if(p==="Vie") app.innerHTML = lifePage();
  else if(p==="Voyages") app.innerHTML = travelPage();
  else if(p==="Sauvegarde") app.innerHTML = savePage();
}

function homePage(){
  return `
    <div class="card">
      <h3>🎬 ÉVOLUTION EN COURS (${S.year})</h3>
      <p><b>Âge :</b> ${S.age} ans | <b>Énergie :</b> ${S.energy}% | <b>Agent :</b> <span class="badge">${S.agent}</span> | <b>Équipe Nationale :</b> <span class="badge">${getNationTeam()}</span></p>
      ${cinematicEvent()}
    </div>
    <div class="grid">
      <div class="card"><div>Technique</div><div class="stat">${S.tech}</div></div>
      <div class="card"><div>Vitesse</div><div class="stat">${S.speed}</div></div>
      <div class="card"><div>Finition</div><div class="stat">${S.finish}</div></div>
      <div class="card"><div>Vision</div><div class="stat">${S.vision}</div></div>
    </div>
    <div class="card" style="margin-top:10px">
      <h3>⚡ ACTIONS, ESSAIS & MÉDIAS</h3>
      <button onclick="train()">⚽ S'entraîner (-20 Énergie)</button>
      <button onclick="rest()">💤 Repos (+30 Énergie)</button>
      <button onclick="playMatch()">🏟️ Jouer Match de Club (-30 Énergie)</button>
      <button onclick="playNationalMatch()">🇬🇳 Match Sélection Nationale (-35 Énergie)</button>
      <button onclick="interviewScene()">🎙️ Conférence de Presse / Médias</button>
    </div>
  `;
}

function cinematicEvent(){
  if(S.age < 14){
    return `
      <div class="cinematic">
        <h2>🎬 CINÉMATIQUE DE FORMATION (ÂGE : ${S.age} ANS)</h2>
        <h4>ÉCOLE DE FOOTBALL DE QUARTIER</h4>
        <p>Les observateurs et recruteurs locaux vous observent à Conakry. Définissez votre axe de développement :</p>
        <button class="choice" onclick="setStyle('collective')">🤝 Jeu Collectif (Priorité Passes & Vision)</button>
        <button class="choice" onclick="setStyle('dribble')">⚡ Jeu Dribbleur (Vitesse & Dribbles)</button>
        <button class="choice" onclick="setStyle('finish')">⚽ Efficacité devant le but (Finition)</button>
      </div>`;
  }
  return `<p>Membre actif chez <b>${S.club}</b>.</p>`;
}

function setStyle(st){ S.style = st; alert("Style de jeu sélectionné !"); persist(); page("Accueil"); }

function train(){
  if(S.energy < 20){alert("Fatigue trop importante ! Prenez du repos.");return;}
  S.energy -= 20; S.tech = clamp(S.tech + 2); S.speed = clamp(S.speed + 1);
  persist(); page("Accueil");
}

function rest(){ S.energy = clamp(S.energy + 30); persist(); page("Accueil"); }

function playMatch(){
  if(S.energy < 30){alert("Énergie insuffisante !");return;}
  S.matches++; S.energy -= 30;
  if(Math.random() < 0.45) S.goals++;

  if(S.age >= 14 && !S.proDebut && overall() >= 45){
    S.proDebut = true;
    alert("🚀 RECORD HISTORIQUE ! À " + S.age + " ans, vous disputez votre tout premier match professionnel ! Un phénomène à la Lamine Yamal !");
  }

  checkTrialOrSeason();
}

function playNationalMatch(){
  if(S.age < 14){alert("Vous devez avoir au moins 14 ans pour être convoqué en équipe nationale de jeunes (U15) !");return;}
  if(S.energy < 35){alert("Énergie insuffisante pour un match international !");return;}
  S.energy -= 35; S.nationalCaps++; S.rep += 8;
  if(Math.random() < 0.4) S.nationalGoals++;
  alert("🇬🇳 MATCH INTERNATIONAL DISPUTÉ ! Vous avez représenté la Guinée avec " + getNationTeam() + " !");
  persist(); page("Accueil");
}

function checkTrialOrSeason(){
  if(S.age >= 14 && Math.random() < 0.28 && !S.trialClub){
    triggerTrial();
  } else if(S.matches >= 12){
    endSeason();
  } else {
    persist(); page("Accueil");
  }
}

function triggerTrial(){
  let euroClubs = ["Arsenal FC", "FC Barcelona", "PSG", "Real Madrid", "Bayern Munich"];
  S.trialClub = euroClubs[Math.floor(Math.random()*euroClubs.length)];
  let app = document.getElementById("app");
  app.innerHTML = `
    <div class="card cinematic">
      <h2>🎬 CINÉMATIQUE : ESSAI DE 2 SEMAINES EN EUROPE !</h2>
      <p>Le grand club <b>${S.trialClub}</b> vous offre une invitation officielle pour un stage intensif de 14 jours dans leurs installations haut de gamme avec hébergement VIP !</p>
      <button onclick="doTrial(true)">🛫 Prendre l'avion et passer l'essai de 2 semaines</button>
      <button onclick="doTrial(false)">❌ Refuser l'invitation et rester au pays</button>
    </div>
  `;
}

function doTrial(accept){
  if(!accept){ S.trialClub = null; persist(); page("Accueil"); return; }
  let success = overall() >= 55 || Math.random() < 0.52;
  if(success){
    S.club = S.trialClub; S.money += 150000; S.rep += 30;
    alert("🌟 ESSAI RÉUSSI DE FAÇON ÉCLATANTE ! " + S.trialClub + " vous fait signer un contrat professionnel direct avec une prime de signature !");
  } else {
    alert("✈️ Fin des 2 semaines d'essai à " + S.trialClub + ". Le staff technique souligne votre fort potentiel mais souhaite vous revoir la saison prochaine.");
  }
  S.trialClub = null; persist(); page("Accueil");
}

function interviewScene(){
  let app = document.getElementById("app");
  app.innerHTML = `
    <div class="card cinematic">
      <h2>🎬 CONFÉRENCE DE PRESSE EN DIRECT</h2>
      <div class="journalism">
        <span class="reporter-tag">Journaliste Médias Sportifs</span><br>
        "On parle de vous comme l'un des talents les plus précoces de votre génération à seulement ${S.age} ans. Comment gérez-vous l'attention des grands clubs et de la sélection nationale ?"
      </div>
      <button class="choice" onclick="answerInterview('humble')">"Je reste concentré sur le travail quotidien, l'apprentissage et le respect des consignes."</button>
      <button class="choice" onclick="answerInterview('confident')">"Je sais ce que je vaux sur le terrain et je suis prêt à devenir une légende du football mondial."</button>
      <button class="choice" onclick="answerInterview('provoc')">"L'attention est normale quand on montre ce niveau. C'est aux adversaires de s'inquiéter !"</button>
    </div>
  `;
}

function answerInterview(type){
  if(type==='humble'){ S.mental = clamp(S.mental + 5); alert("La presse et vos entraîneurs saluent votre grande maturité ! (+5 Mental)"); }
  else if(type==='confident'){ S.rep += 12; alert("Vos propos ambitieux font la Une des journaux sportifs ! (+12 Réputation)"); }
  else { S.rep += 18; S.family = clamp(S.family - 5); alert("Déclaration choc relayée partout sur les réseaux !"); }
  persist(); page("Accueil");
}

function endSeason(){
  S.age++; S.year++; S.matches = 0; S.energy = 100;
  alert("🎬 FIN DE SAISON ! Vos compteurs sont mis à jour pour vos " + S.age + " ans.");
  persist(); page("Accueil");
}

function nationalPage(){
  return `
    <div class="card">
      <h2>🇬🇳 SÉLECTION NATIONALE & TOURNOIS</h2>
      <p><b>Catégorie :</b> <span class="badge">${getNationTeam()}</span></p>
      <p><b>Matchs disputés (Capes) :</b> ${S.nationalCaps}</p>
      <p><b>Buts sous le maillot national :</b> ${S.nationalGoals}</p>
      <hr>
      <p>Portez fièrement le maillot national lors des matchs officiels et tournois régionaux/internationaux.</p>
      <button onclick="playNationalMatch()">🏟️ Jouer un match de sélection</button>
    </div>
  `;
}

function agentPage(){
  return `
    <div class="card">
      <h2>🤝 AGENT & CHOIX STRATÉGIQUES (DÈS 6 ANS)</h2>
      <p><b>Représentant actuel :</b> ${S.agent}</p>
      <p><b>Confiance :</b> ${S.agentTrust}% | <b>Commission :</b> ${S.agentFee}%</p>
      <hr>
      <h3>Modifier le choix d'agent :</h3>
      <button class="choice" onclick="setAgent('Parents', 100, 0)">👨‍👩‍👦 Vos Parents (Confiance 100% | 0% commission)</button>
      <button class="choice" onclick="setAgent('Grand Frère', 85, 5)">👦 Grand Frère (Confiance 85% | 5% commission)</button>
      <button class="choice" onclick="setAgent('Agent VIP Extérieur', 50, 15)">💼 Agent VIP Extérieur (Très gros réseau | 15% commission)</button>
    </div>`;
}

function setAgent(ag, trust, fee){
  S.agent = ag; S.agentTrust = trust; S.agentFee = fee;
  alert("Agent sélectionné : " + ag);
  persist(); page("Agent");
}

function careerPage(){
  return `
    <div class="card">
      <h2>📈 CARRIÈRE PRO & SPONSORS</h2>
      <p><b>Club actuel :</b> ${S.club}</p>
      <p><b>Statut :</b> ${S.proDebut ? '⭐ Plus Jeune Joueur Pro' : '👶 En Académie de Formation'}</p>
      <p><b>Sponsor Principal :</b> ${S.sponsor}</p>
      <p><b>Buts en club :</b> ${S.goals}</p>
      ${S.age >= 14 ? '<button onclick="signSponsor()">✒️ Signer/Renouveler un Sponsor</button>' : '<p class="muted">Disponible dès 14 ans.</p>'}
    </div>`;
}

function signSponsor(){
  let brands = ["Nike Football", "Adidas Pro", "Puma King"];
  let chosen = brands[Math.floor(Math.random()*brands.length)];
  S.sponsor = chosen; S.money += 70000;
  alert("Contrat signé avec " + chosen + " ! Prime reçue : 70 000 €");
  persist(); page("Carrière");
}

function travelPage(){
  let html = `<div class="card">
    <h2>✈️ SÉJOURS, HÔTELS & MONDE</h2>
    <p><b>Jet Privé :</b> ${S.hasPrivateJet ? '<span class="badge">Possédé 🛩️</span>' : 'Non possédé'}</p>
    ${!S.hasPrivateJet ? '<button onclick="buyJet()">💳 Acheter un Jet Privé (5 000 000 €)</button>' : ''}
  </div><div class="grid2">`;

  WORLD_DESTINATIONS.forEach(d => {
    let hasVisa = !d.visa || S.visas[d.name.split(' ')[0]];
    html += `
      <div class="card">
        <h3>📍 ${d.name}</h3>
        <p>${d.desc}</p>
        <p><b>Coût déplacement :</b> ${S.hasPrivateJet ? 'Gratuit (Jet Privé)' : d.cost + ' €'}</p>
        <p><b>Visa requises :</b> ${d.visa ? (hasVisa ? '✅ Obtenu' : '❌ Non obtenu') : 'Non requis'}</p>
        ${d.visa && !hasVisa ? `<button onclick="applyVisa('${d.name.split(' ')[0]}')">📄 Demander Visa (500 €)</button>` : ''}
        <button class="choice" onclick="travelTo('${d.name}')">✈️ Résider à l'Hôtel & Explorer</button>
      </div>`;
  });
  html += `</div>`;
  return html;
}

function buyJet(){
  if(S.money < 5000000){alert("Fonds insuffisants !");return;}
  S.money -= 5000000; S.hasPrivateJet = true;
  alert("Achat de votre Jet Privé confirmé !");
  persist(); page("Voyages");
}

function applyVisa(c){
  if(S.money < 500){alert("Fonds insuffisants !");return;}
  S.money -= 500; S.visas[c] = true;
  alert("Visa accordé pour " + c + " !");
  persist(); page("Voyages");
}

function travelTo(destName){
  let app = document.getElementById("app");
  app.innerHTML = `
    <div class="card cinematic">
      <h2>🏨 SÉJOUR À ${destName.toUpperCase()}</h2>
      <p>Installation dans un complexe hôtelier haut de gamme 5 Étoiles.</p>
      <button class="choice" onclick="doActivity('museum')">🏛️ Musées, monuments et culture</button>
      <button class="choice" onclick="doActivity('stadium')">🏟️ Visite d'infrastructures et stades</button>
      <button class="choice" onclick="doActivity('fans')">🤳 Rencontre avec les supporters locaux</button>
      <button class="choice" onclick="doActivity('authority')">🏛️ Audiences officielles et ambassades</button>
      <br><br><button onclick="page('Accueil')">🔙 Retourner au Menu Principal</button>
    </div>`;
}

function doActivity(act){
  if(act === 'museum'){ S.mental = clamp(S.mental + 10); alert("Superbe sortie culturelle ! (+10 Mental)"); }
  else if(act === 'stadium'){ S.vision = clamp(S.vision + 5); alert("Inspiration tactique et sportive ! (+5 Vision)"); }
  else if(act === 'fans'){ S.rep += 15; alert("Rencontre très populaire avec les fans ! (+15 Réputation)"); }
  else if(act === 'authority'){
    if(S.rep < 40){ alert("Réputation insuffisante (40+ requis)."); return; }
    S.rep += 25; S.money += 20000; alert("Audience officielle accordée avec les honneurs !");
  }
  persist();
}

function lifePage(){
  return `
    <div class="card">
      <h2>🚗 PERMIS & DOCUMENTS OFFICIELS</h2>
      <p><b>Permis Voiture :</b> ${S.licenses.auto ? '✅ Obtenu' : '❌ Non possédé'}</p>
      <p><b>Permis Bateau / Yacht :</b> ${S.licenses.boat ? '✅ Obtenu' : '❌ Non possédé'}</p>
      <p><b>Licence Pilotage Jet :</b> ${S.licenses.pilot ? '✅ Obtenue' : '❌ Non possédée'}</p>
      <hr>
      ${!S.licenses.auto ? '<button onclick="passLicense(\'auto\', 1500)">🚗 Passer Permis Auto (1 500 €)</button>' : ''}
      ${!S.licenses.boat ? '<button onclick="passLicense(\'boat\', 5000)">🚤 Passer Permis Bateau (5 000 €)</button>' : ''}
      ${!S.licenses.pilot ? '<button onclick="passLicense(\'pilot\', 20000)">🛩 Passer Licence Pilotage (20 000 €)</button>' : ''}
    </div>`;
}

function passLicense(type, cost){
  if(S.money < cost){alert("Fonds insuffisants !");return;}
  S.money -= cost; S.licenses[type] = true;
  alert("Examen réussi avec succès !");
  persist(); page("Vie");
}

function savePage(){
  return `
    <div class="card">
      <h2>💾 GESTION DE SAUVEGARDE</h2>
      <button onclick="persist();alert('Partie sauvegardée !')">Sauvegarder</button>
      <button onclick="if(confirm('Recommencer à zéro ?')){localStorage.clear();location.reload();}">Réinitialiser la partie</button>
    </div>`;
}

page("Accueil");
</script>
</body>
</html>
